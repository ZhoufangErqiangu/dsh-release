# Release pin — the only place that decides which DSH source becomes the .deb.
#
# DSH_REF must be an immutable ref: a tag (e.g. dsh-v0.2.2-rc.5) or a full
# 40-character commit hash. Branches are rejected by scripts/fetch-source.sh.
#
# These are defaults, not assignments: an environment variable or a make
# command-line override (make DSH_REF=...) takes precedence, so one release can
# be rebuilt from a different pin without editing this file.
: "${DSH_REPO_URL:=https://github.com/deepseek-ai/deepseek-harness.git}"
: "${DSH_REF:=dsh-v0.2.2-rc.5}"

# Debian identity. The binary is /usr/bin/dsh, but the package cannot be named
# "dsh": Ubuntu/Debian already ships an unrelated "dsh" (distributed shell)
# package that owns /usr/bin/dsh, so this package declares Conflicts/Replaces.
: "${DEB_PACKAGE:=deepseek-harness}"
: "${DEB_REVISION:=1}"
: "${DEB_ARCH:=amd64}"
: "${DEB_MAINTAINER:=DSH Packaging <dsh-packaging@localhost>}"

# Node.js comes from the system (no bundled runtime). The package declares
# Depends: nodejs (>= 24.9.0); Ubuntu 24.04's archive Node is older, so users
# install Node 24 from NodeSource (see README).
: "${NODE_MIN:=24.9.0}"

# Export the resolved values so child scripts see command-line overrides too.
export DSH_REPO_URL DSH_REF DEB_PACKAGE DEB_REVISION DEB_ARCH DEB_MAINTAINER NODE_MIN
