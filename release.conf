# Release pin — the only place that decides which DSH source becomes the .deb.
#
# DSH_REF must be an immutable ref: a tag (e.g. dsh-v0.2.2-rc.5) or a full
# 40-character commit hash. Branches are rejected by scripts/fetch-source.sh.
#
# These are defaults, not assignments: an environment variable or a make
# command-line override (make DSH_REF=...) takes precedence, so one release can
# be rebuilt from a different pin without editing this file.
: "${DSH_REPO_URL:=https://github.com/deepseek-ai/deepseek-harness.git}"
: "${DSH_REF:=dsh-v0.2.2-rc.5}"

# Debian identity. The binary is /usr/bin/dsh, but the package cannot be named
# "dsh": Ubuntu/Debian already ships an unrelated "dsh" (distributed shell)
# package that owns /usr/bin/dsh, so this package declares Conflicts/Replaces.
: "${DEB_PACKAGE:=deepseek-harness}"
: "${DEB_ARCH:=amd64}"
: "${DEB_MAINTAINER:=DSH Packaging <dsh-packaging@localhost>}"

# Our release identity. A release version is
#
#   v<upstream-version>-alex.<N>      (for example v0.2.2-rc.5-alex.1)
#
# and the .deb version is the same information in Debian syntax:
#
#   0.2.2~rc.5-alex.1
#
# <upstream-version> always comes from the pinned DSH checkout (package.json),
# never from this file; DSH_RELEASE_ID is our build marker and N is a
# repository-wide, monotonically increasing build number that scripts/release.sh
# maintains from git tags. This value is the "last released" pointer: plain
# `make` builds it, while scripts/release.sh always computes the next N.
: "${DSH_RELEASE_ID:=alex}"
: "${DEB_REVISION:=alex.1}"

# Node.js comes from the system (no bundled runtime). The package declares
# Depends: nodejs (>= 24.9.0); Ubuntu 24.04's archive Node is older, so users
# install Node 24 from NodeSource (see README).
: "${NODE_MIN:=24.9.0}"

# pnpm ships inside the package so `dsh plugin` and the Web Plugins page work
# on a fresh install: Ubuntu 24.04 has no pnpm package, and corepack resolves a
# moving "latest" instead of the version the upstream repository pins. Keep
# PNPM_VERSION in sync with packageManager in the pinned DSH checkout, and
# update the checksum whenever the version changes:
#   curl -fsSL "$PNPM_BASE_URL/pnpm-$PNPM_VERSION.tgz" | sha256sum
: "${PNPM_VERSION:=11.28.5}"
: "${PNPM_TARBALL_SHA256:=1ef4e447a68713656064f3f174c0f44719960a043a3fe2299169d08cf1dbf8ee}"
: "${PNPM_BASE_URL:=https://registry.npmjs.org/pnpm/-}"

# Export the resolved values so child scripts see command-line overrides too.
export DSH_REPO_URL DSH_REF DEB_PACKAGE DEB_REVISION DEB_ARCH DEB_MAINTAINER NODE_MIN DSH_RELEASE_ID
export PNPM_VERSION PNPM_TARBALL_SHA256 PNPM_BASE_URL
