name: build-deb

# Build the DeepSeek Harness .deb from the source pin in release.conf, install
# it on a clean Ubuntu 24.04 runner, and publish the artifacts. The package's
# service is a systemd *user* unit; CI checks that no root unit appears and
# that the unit is enabled for the installing user.
#
# Releases are tag-driven: scripts/release.sh creates v<upstream>-alex.<N> and
# pushes it, which runs this workflow. The tag is validated against
# release.conf and the resolved upstream checkout before anything is built, so
# a tag can never advertise a version the repository does not reproduce.
on:
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: 'Upstream tag, e.g. dsh-v0.2.2-rc.5 (the dsh- prefix may be omitted) or a full 40-character commit'
        required: false
        type: string
      deb_revision:
        description: 'Build identifier, e.g. alex.7 (defaults to release.conf; release tags must be v<version>-alex.<N>)'
        required: false
        type: string
  push:
    tags:
      # Keep in sync with DSH_RELEASE_ID in release.conf.
      - 'v*-alex.*'

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

# Workflow-wide read access; the release job tightens this to contents: write.
permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git xz-utils

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Keep this in sync with packageManager in the pinned DSH checkout.
      # scripts/build-source.sh refuses to run when the major pin differs.
      - name: Install pnpm 11.28.5
        run: npm install --global pnpm@11.28.5

      # The source install plus staged runtime needs several GB; GitHub's
      # hosted image carries large SDKs that this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Show toolchain
        run: |
          node --version
          pnpm --version
          dpkg-deb --version | head -n 1
          df -h /

      # A pushed release tag drives the version: refuse overrides that could
      # make the tag and the built package disagree. Manual dispatch keeps the
      # existing escape hatch for test builds.
      - name: Resolve dispatch inputs
        id: dispatch
        env:
          INPUT_DSH_REF: ${{ github.event.inputs.dsh_ref }}
          INPUT_DEB_REVISION: ${{ github.event.inputs.deb_revision }}
        run: |
          set -euo pipefail
          repo="$(. ./release.conf; printf '%s' "$DSH_REPO_URL")"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            id="$(. ./release.conf; printf '%s' "$DSH_RELEASE_ID")"
            if [[ ! "$tag" =~ ^v.+-"$id"\.[0-9]+$ ]]; then
              echo "::error::tag '$tag' is not a release tag of the form v<upstream-version>-$id.<N>"
              exit 1
            fi
            if [ -n "${INPUT_DSH_REF:-}" ] || [ -n "${INPUT_DEB_REVISION:-}" ]; then
              echo "::error::refusing dsh_ref/deb_revision overrides on a release tag; the tag must build release.conf's pin and revision"
              exit 1
            fi
            {
              echo "tag_build=true"
              echo "release_tag=$tag"
              echo "dsh_ref="
              echo "deb_revision="
            } >> "$GITHUB_OUTPUT"
            echo "release tag: $tag"
            exit 0
          fi

          ref="${INPUT_DSH_REF:-}"
          if [ -n "$ref" ]; then
            if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
              :
            elif git ls-remote --exit-code --tags "$repo" "refs/tags/$ref" >/dev/null 2>&1; then
              :
            elif git ls-remote --exit-code --tags "$repo" "refs/tags/dsh-$ref" >/dev/null 2>&1; then
              echo "::notice::dsh_ref '$ref' resolved to upstream tag 'dsh-$ref'"
              ref="dsh-$ref"
            else
              echo "::error::upstream tag '$ref' not found in $repo; use a tag like dsh-v0.2.2-rc.5 or a full 40-character commit"
              exit 1
            fi
          fi

          revision="${INPUT_DEB_REVISION:-}"
          if [ -n "$revision" ] && ! printf '%s' "$revision" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+~]*$'; then
            echo "::error::deb_revision '$revision' is not a valid Debian revision; use only letters, digits, '.', '+', '~' (for example 'alex.7'), not the upstream version"
            exit 1
          fi

          {
            echo "tag_build=false"
            echo "release_tag="
            echo "dsh_ref=$ref"
            echo "deb_revision=$revision"
          } >> "$GITHUB_OUTPUT"
          echo "dsh_ref=${ref:-<release.conf pin>}"
          echo "deb_revision=${revision:-<release.conf revision>}"

      # Resolve the pin before the expensive build so the tag can be validated
      # against the actual upstream package.json version. make later reuses this
      # checkout.
      - name: Fetch the pinned source
        if: steps.dispatch.outputs.tag_build == 'true'
        run: scripts/fetch-source.sh

      - name: Validate the release tag against the pin
        id: release
        if: steps.dispatch.outputs.tag_build == 'true'
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Build, package and verify
        env:
          TAG_BUILD: ${{ steps.dispatch.outputs.tag_build }}
          RELEASE_REVISION: ${{ steps.release.outputs.release_revision }}
          RESOLVED_DSH_REF: ${{ steps.dispatch.outputs.dsh_ref }}
          RESOLVED_DEB_REVISION: ${{ steps.dispatch.outputs.deb_revision }}
          # Private-repo runners have 7 GB RAM; keep aggregate build gates
          # from overlapping too aggressively.
          DSH_GATE_CONCURRENCY: '2'
        run: |
          args=()
          if [ "$TAG_BUILD" = "true" ]; then
            args+=("DEB_REVISION=$RELEASE_REVISION")
          else
            if [ -n "${RESOLVED_DSH_REF:-}" ]; then args+=("DSH_REF=${RESOLVED_DSH_REF}"); fi
            if [ -n "${RESOLVED_DEB_REVISION:-}" ]; then args+=("DEB_REVISION=${RESOLVED_DEB_REVISION}"); fi
          fi
          make "${args[@]}"

      - name: Show provenance and verify the artifacts
        env:
          TAG_BUILD: ${{ steps.dispatch.outputs.tag_build }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_DEB_VERSION: ${{ steps.release.outputs.release_deb_version }}
        run: |
          set -euo pipefail
          cat build/source.env
          deb="dist/$(cat dist/latest.txt)"
          dpkg-deb -f "$deb" \
            Package Version Architecture Depends Conflicts \
            X-DSH-Source-Ref X-DSH-Source-Commit X-DSH-Bundled-Pnpm
          ( cd dist && sha256sum -c ./*.sha256 )

          if [ "$TAG_BUILD" = "true" ]; then
            # Re-check after the build: the tag, the source record, and the
            # package must all describe the same release.
            scripts/check-release-tag.sh "$RELEASE_TAG" >/dev/null
            version="$(dpkg-deb -f "$deb" Version)"
            [ "$version" = "$RELEASE_DEB_VERSION" ] || {
              echo "::error::package Version '$version' != tag version '$RELEASE_DEB_VERSION'"
              exit 1
            }
            manifest_tag="$(node -p "require('./dist/release.json').releaseTag")"
            [ "$manifest_tag" = "$RELEASE_TAG" ] || {
              echo "::error::release.json releaseTag '$manifest_tag' != tag '$RELEASE_TAG'"
              exit 1
            }
            echo "release artifacts match $RELEASE_TAG"
          fi

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: |
            dist/*.deb
            dist/*.sha256
            dist/release.json
            build/source.env
          if-no-files-found: error
          retention-days: 14

  install-test:
    name: Install and run as a user service
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the verification script
        uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: pkg

      # The deb depends on the system nodejs (>= 24.9.0). Ubuntu 24.04's
      # archive Node is too old, so install Node 24 from NodeSource first.
      - name: Install Node.js 24 as an apt package
        run: |
          sudo apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          /usr/bin/node --version

      # DSH_DEB_USER makes the postinst enable dsh-web for the runner user even
      # when the CI environment does not preserve SUDO_USER.
      - name: Install the deb for the runner user
        run: sudo DSH_DEB_USER=runner apt-get install -y ./pkg/dist/*.deb

      - name: Verify installation, user unit and Web UI auth
        run: bash scripts/ci-install-smoke.sh

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: release

      - name: Check the artifacts against the release tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          deb="$(ls release/dist/*.deb)"
          version="$(dpkg-deb -f "$deb" Version)"
          manifest_tag="$(node -p "require('./release/dist/release.json').releaseTag")"
          manifest_version="$(node -p "require('./release/dist/release.json').debVersion")"
          manifest_sha="$(node -p "require('./release/dist/release.json').sha256")"
          [ "$manifest_tag" = "$tag" ] || { echo "::error::release.json is for '$manifest_tag', not '$tag'"; exit 1; }
          [ "$version" = "$manifest_version" ] || { echo "::error::package Version '$version' != manifest '$manifest_version'"; exit 1; }
          ( cd release/dist && sha256sum -c ./*.sha256 )
          actual_sha="$(sha256sum "$deb" | cut -d' ' -f1)"
          [ "$actual_sha" = "$manifest_sha" ] || { echo "::error::package sha256 '$actual_sha' != manifest '$manifest_sha'"; exit 1; }
          echo "publishing $tag ($version, sha256 $actual_sha)"

      # GitHub release asset names only keep [A-Za-z0-9._-]; a Debian version
      # like 0.2.2~rc.5 would be stored as 0.2.2.rc.5. Prepare the upload names
      # and matching checksum/manifest here, so users can verify what they
      # actually download. The version inside the .deb is unchanged.
      - name: Prepare GitHub-safe asset names
        run: |
          set -euo pipefail
          mkdir -p release/upload
          deb="$(ls release/dist/*.deb)"
          base="$(basename "$deb")"
          safe="$(printf '%s' "$base" | sed 's/[^A-Za-z0-9._-]/./g')"
          if [ "$safe" != "$base" ]; then
            echo "::notice::GitHub stores '$base' as '$safe'"
          fi
          cp "$deb" "release/upload/$safe"
          ( cd release/upload && sha256sum "$safe" > "$safe.sha256" )
          node -e '
            const fs = require("node:fs")
            const [src, file, out] = process.argv.slice(1)
            const manifest = JSON.parse(fs.readFileSync(src, "utf8"))
            manifest.file = file
            fs.writeFileSync(out, JSON.stringify(manifest, null, 2) + "\n")
          ' release/dist/release.json "$safe" release/upload/release.json
          ( cd release/upload && sha256sum -c ./*.sha256 )
          ls -l release/upload

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(release/upload/*.deb release/upload/*.sha256 release/upload/release.json)
          ref="$(sed -n "s/^DSH_REF='\(.*\)'$/\1/p" release/build/source.env | head -n1)"
          commit="$(sed -n "s/^DSH_COMMIT='\([0-9a-f]*\)'$/\1/p" release/build/source.env | head -n1)"
          deb_version="$(sed -n "s/^DEB_FULL_VERSION='\(.*\)'$/\1/p" release/build/source.env | head -n1)"
          notes="$(printf 'Debian package %s built from %s (%s).\n\nInstalls the dsh CLI and dsh-web.service, a systemd user service; no root system service is installed.' "$deb_version" "$ref" "$commit")"
          prerelease=()
          case "$tag" in
            *-rc.*|*-alpha.*|*-beta.*) prerelease+=(--prerelease) ;;
          esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$tag" --notes "$notes" "${prerelease[@]}"
          fi
